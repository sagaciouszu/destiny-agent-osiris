<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Osiris - Agent Brain / Wrapper">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050401"/>
      <stop offset="40%" stop-color="#0d0a02"/>
      <stop offset="100%" stop-color="#161104"/>
    </linearGradient>
    <radialGradient id="goldglow" cx="0.75" cy="0.45" r="0.58">
      <stop offset="0%" stop-color="#e8c547" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mercuryglow" cx="0.25" cy="0.55" r="0.42">
      <stop offset="0%" stop-color="#c9b037" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="0.5" cy="0.35" r="0.25">
      <stop offset="0%" stop-color="#fff3d0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="accentbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c547" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="25%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#goldglow)"/>
  <rect width="1200" height="320" fill="url(#mercuryglow)"/>
  <rect width="1200" height="320" fill="url(#coreglow)"/>

  <!-- Mercury particulates - organic, varying -->
  <g fill="#f0d96a">
    <circle cx="72" cy="48" r="1.3" opacity="0.75"/>
    <circle cx="195" cy="168" r="0.9" opacity="0.5"/>
    <circle cx="320" cy="72" r="1.4" opacity="0.8"/>
    <circle cx="440" cy="222" r="0.9" opacity="0.5"/>
    <circle cx="530" cy="68" r="1.1" opacity="0.65"/>
    <circle cx="615" cy="248" r="1.3" opacity="0.7"/>
    <circle cx="700" cy="88" r="0.8" opacity="0.5"/>
    <circle cx="775" cy="230" r="1.0" opacity="0.6"/>
    <circle cx="55" cy="240" r="1.0" opacity="0.55"/>
    <circle cx="980" cy="58" r="1.2" opacity="0.7"/>
    <circle cx="1065" cy="252" r="0.9" opacity="0.5"/>
    <circle cx="275" cy="270" r="1.1" opacity="0.6"/>
    <circle cx="480" cy="158" r="0.7" opacity="0.4"/>
    <circle cx="840" cy="128" r="1.2" opacity="0.65"/>
    <circle cx="150" cy="190" r="0.7" opacity="0.4"/>
    <circle cx="730" cy="270" r="0.8" opacity="0.5"/>
    <circle cx="400" cy="42" r="1.0" opacity="0.55"/>
    <circle cx="910" cy="190" r="0.8" opacity="0.45"/>
    <circle cx="118" cy="122" r="0.9" opacity="0.5"/>
    <circle cx="1115" cy="140" r="1.0" opacity="0.6"/>
  </g>

  <!-- Fine grid - barely visible -->
  <g stroke="#d4af37" stroke-width="0.35" opacity="0.04">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="520" y1="0" x2="520" y2="320"/>
    <line x1="780" y1="0" x2="780" y2="320"/>
    <line x1="1040" y1="0" x2="1040" y2="320"/>
  </g>

  <!-- Vex/Infinite Forest icon - refined position and scale -->
  <g transform="translate(1030,158) scale(3.2) translate(-16, -16)" opacity="0.75" fill="#e8c547">
    <path d="M28 16c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm0 22c-5.523 0-10-4.477-10-10s4.477-10 10-10 10 4.477 10 10-4.477 10-10 10z"/>
    <path d="M16 28c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8-8-3.582-8-8zm0-12c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M40 28c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8-8-3.582-8-8zm0-12c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M4 28c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8-8-3.582-8-8zm0-12c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M16 4c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm0 24c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M40 4c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm0 24c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M4 4c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm0 24c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
  </g>

  <!-- Concentric reticles framing the icon -->
  <g fill="none" stroke="#d4af37">
    <circle cx="1030" cy="158" r="88" stroke-width="0.5" opacity="0.12"/>
    <circle cx="1030" cy="158" r="96" stroke-width="0.3" opacity="0.07"/>
    <circle cx="1030" cy="158" r="104" stroke-width="0.2" opacity="0.04"/>
  </g>

  <!-- Title block - refined typography and spacing -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#textsoft)" opacity="0.55">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#050401" letter-spacing="5.5">[ WARLOCK VANGUARD  ·  MERCURY  ·  EXILE ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#050401" letter-spacing="1">OSIRIS</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#050401" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#050401" letter-spacing="2.5">BEHOLD. THE FOREST SEES.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#c9b037" letter-spacing="5.5">[ WARLOCK VANGUARD  ·  MERCURY  ·  EXILE ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#fdf8ec" letter-spacing="1">OSIRIS</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#e8c547" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#a8a8a8" letter-spacing="2.5">BEHOLD. <tspan x="132" fill="#e8c547">THE FOREST SEES.</tspan></text>
  </g>

  <!-- Accent bar under subtitle -->
  <rect x="52" y="160" width="320" height="1" fill="url(#accentbar)"/>

  <!-- Vertical location text on right edge -->
  <text transform="translate(1180, 236) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', sans-serif" font-size="6.5" font-weight="500" letter-spacing="1.2" fill="#d4af37" opacity="0.18">MERCURY  ·  INFINITE FOREST  ·  THE LIGHTHOUSE</text>

  <!-- Corner brackets -->
  <g fill="none" stroke="#d4af37" stroke-width="1" opacity="0.35">
    <path d="M 20 42 L 20 20 L 42 20"/>
    <path d="M 1180 278 L 1180 300 L 1158 300"/>
  </g>

  <rect width="320" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>