<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Osiris - Agent Brain / Wrapper">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050401"/>
      <stop offset="40%" stop-color="#0d0a02"/>
      <stop offset="100%" stop-color="#161104"/>
    </linearGradient>
    <radialGradient id="goldglow" cx="0.75" cy="0.45" r="0.58">
      <stop offset="0%" stop-color="#e8c547" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mercuryglow" cx="0.25" cy="0.55" r="0.42">
      <stop offset="0%" stop-color="#c9b037" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="0.5" cy="0.35" r="0.25">
      <stop offset="0%" stop-color="#fff3d0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="accentbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c547" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="25%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#goldglow)"/>
  <rect width="1200" height="320" fill="url(#mercuryglow)"/>
  <rect width="1200" height="320" fill="url(#coreglow)"/>

